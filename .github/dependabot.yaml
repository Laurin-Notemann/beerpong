version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      patch-dependencies:
        update-types:
          - 'patch'
    ignore:
      # Expo's Babel preset and its plugins require Babel 7 (api.assertVersion(7))
      - dependency-name: '@babel/core'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
