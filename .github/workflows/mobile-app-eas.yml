name: Mobile App Staging

# Ships every staging push of the iOS app, on the runner itself (no EAS cloud builds). Android only
# ships when started by hand (Actions -> Mobile App Staging -> Run workflow, platform android).
#
# Per platform: if a build with the same native fingerprint is registered on EAS, only an OTA
# update is published to that build's channel. Otherwise the app is built here with
# `eas build --local`, registered on EAS with `eas upload` (so the next run finds it), and on
# iOS submitted to TestFlight.
#   iOS     -> profile/channel/environment "production": store build, TestFlight
#   Android -> profile/channel/environment "preview":    internal APK

on:
  push:
    branches:
      - staging
    paths:
      - "apps/mobile/**"
      - "package-lock.json"
      - ".github/workflows/mobile-app-eas.yml"
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to ship
        type: choice
        options: [ios, android, both]
        default: ios
      native_build:
        description: Build natively even if a build with the same fingerprint exists
        type: boolean
        default: false

defaults:
  run:
    working-directory: apps/mobile

jobs:
  ship:
    name: Ship ${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'ios' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 120
    # One run per platform at a time. A newer push waits instead of cancelling, so a native
    # build is never cut off halfway, and only the newest waiting push runs next.
    concurrency:
      group: mobile-app-staging-${{ matrix.platform }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # pushes have no inputs, so they ship iOS only
        platform: ${{ fromJSON(inputs.platform == 'both' && '["ios","android"]' || inputs.platform == 'android' && '["android"]' || '["ios"]') }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      EXPO_PUBLIC_GIT_COMMIT: ${{ github.sha }}
      PLATFORM: ${{ matrix.platform }}
      PROFILE: ${{ matrix.platform == 'ios' && 'production' || 'preview' }}
      ARTIFACT: ${{ matrix.platform == 'ios' && 'app.ipa' || 'app.apk' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          # pinned: the action caches eas-cli per version, and `latest` is a new, uncached version
          # on most runs. Bump it by hand now and then.
          eas-version: 24.11.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # The profile name is also the channel and the EAS environment (see eas.json).
      - name: Find matching build
        id: match
        run: |
          fingerprint=$(eas fingerprint:generate -p "$PLATFORM" --environment "$PROFILE" --json --non-interactive \
            | sed -n '/^{/,$p' | jq -r .hash)
          build_id=$(eas build:list -p "$PLATFORM" --fingerprint-hash "$fingerprint" --status finished \
            --limit 1 --json --non-interactive | jq -r '.[0].id // empty')
          if [ "${{ inputs.native_build }}" = "true" ]; then build_id=""; fi
          echo "fingerprint $fingerprint, matching build: ${build_id:-none}"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      # Runtime unchanged -> OTA update

      # Metro's transforms from the last update, so the bundle isn't built from scratch. Expo reads
      # them from EXPO_METRO_CACHE_RESTORE_DIR and writes only the ones this bundle used to
      # EXPO_METRO_CACHE_OUTPUT_DIR, which is saved for the next run, so the cache doesn't grow.
      - name: Restore Metro cache
        if: steps.match.outputs.build_id
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/metro-cache
          key: metro-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: metro-${{ matrix.platform }}-

      - name: Publish update
        if: steps.match.outputs.build_id
        env:
          EXPO_METRO_CACHE_RESTORE_DIR: ${{ runner.temp }}/metro-restored
          EXPO_METRO_CACHE_OUTPUT_DIR: ${{ runner.temp }}/metro-cache
        run: |
          mkdir -p "$EXPO_METRO_CACHE_OUTPUT_DIR"
          mv "$EXPO_METRO_CACHE_OUTPUT_DIR" "$EXPO_METRO_CACHE_RESTORE_DIR"
          mkdir "$EXPO_METRO_CACHE_OUTPUT_DIR"
          eas update --platform "$PLATFORM" --channel "$PROFILE" --environment "$PROFILE" \
            --message "staging $GITHUB_SHA" --non-interactive
          npx sentry-expo-upload-sourcemaps dist

      - name: Save Metro cache
        if: steps.match.outputs.build_id
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/metro-cache
          key: metro-${{ matrix.platform }}-${{ github.sha }}

      # Runtime changed -> native build

      - name: Setup Java
        if: ${{ !steps.match.outputs.build_id && matrix.platform == 'android' }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Build
        if: ${{ !steps.match.outputs.build_id }}
        run: |
          eas build --local -p "$PLATFORM" --profile "$PROFILE" --non-interactive \
            --output "$RUNNER_TEMP/$ARTIFACT"

      - name: Submit to TestFlight
        if: ${{ !steps.match.outputs.build_id && matrix.platform == 'ios' }}
        run: eas submit -p ios --profile production --path "$RUNNER_TEMP/$ARTIFACT" --non-interactive

      - name: Register build on EAS
        if: ${{ !steps.match.outputs.build_id }}
        run: |
          eas upload -p "$PLATFORM" --build-path "$RUNNER_TEMP/$ARTIFACT" \
            --fingerprint "${{ steps.match.outputs.fingerprint }}" --non-interactive

      - name: Keep the build
        if: ${{ !steps.match.outputs.build_id }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ env.ARTIFACT }}
          retention-days: 14
