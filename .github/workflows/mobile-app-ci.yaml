name: Mobile App CI

# Typechecks the app (TypeScript 7). Lint and format run for the whole repo in lint.yml.

on:
  push:
    paths:
      - "apps/mobile/**"
      - "package-lock.json"

defaults:
  run:
    working-directory: apps/mobile

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install dependencies
        run: npm ci
      - name: Run typecheck
        run: npm run typecheck
