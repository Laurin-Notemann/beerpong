name: Mobile App CI

on:
  push:
    paths:
      - "apps/mobile/**"
      - "package-lock.json"

defaults:
  run:
    working-directory: apps/mobile

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install dependencies
        run: npm install
      - name: Run lint
        run: npm run ci:lint

  format:
    name: Assert code formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install dependencies
        run: npm install
      - name: Run format check
        run: npm run ci:format
