name: Mobile App CI

# Typechecks the app (TypeScript 7). Lint and format run for the whole repo in lint.yml.

on:
  push:
    paths:
      - "apps/mobile/**"
      - "pnpm-lock.yaml"

defaults:
  run:
    working-directory: apps/mobile

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run typecheck
        run: pnpm run typecheck
