name: Api Staging Deploy

# Vets, builds and deploys the Go API (apps/api/) to the staging server, where
# it runs as beerpong-api-go-staging in ~/docker/beerpong-api-go. Migrations
# run when the container starts (DB_MIGRATE in the server's .env).

on:
  push:
    branches:
      - "staging"
    paths:
      - "apps/api/**"
      - ".github/workflows/api-staging-cd.yml"
      - ".github/workflows/api-go-ci.yml"
  workflow_dispatch:

concurrency:
  group: api-staging-deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/api-go-ci.yml
    secrets: inherit

  # builds while the checks run; only deploy waits for both
  build-api:
    permissions:
      id-token: write
      contents: read
    name: Build and push staging image to Google ACR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: true
          token_format: access_token
          workload_identity_provider: 'projects/5685154754/locations/global/workloadIdentityPools/cd-beerpong/providers/github-actions'
          service_account: 'cd-beerpong@beer-pong-441815.iam.gserviceaccount.com'
      - name: Login to GAR
        uses: docker/login-action@v4
        with:
          registry: europe-west10-docker.pkg.dev/beer-pong-441815/api-beerpong
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: apps/api
          platforms: linux/amd64
          build-args: SENTRY_RELEASE=api-go@${{ github.sha }}
          # mode=max also caches the build stage (go mod download), not just the final image
          cache-from: type=gha,scope=api-go
          cache-to: type=gha,scope=api-go,mode=max
          tags: europe-west10-docker.pkg.dev/beer-pong-441815/api-beerpong/api-go-staging:${{ github.sha }}

  deploy-api:
    needs: [test, build-api]
    name: Deploy staging api on a bare metal server
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_SECRET }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy and wait for the healthcheck
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          FILE_PATH: ${{ secrets.PATH_TO_SERVICE_ACC_JSON }}
          DOCKER_IMAGE: europe-west10-docker.pkg.dev/beer-pong-441815/api-beerpong/api-go-staging:${{ github.sha }}
          # the Apple push key for Live Activities and the widget (base64 of the .p8); without
          # it the API runs and pushes nothing
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_KEY: ${{ secrets.APNS_KEY }}
        run: |
          # The script arrives on stdin, so every command that could read
          # stdin gets /dev/null; otherwise it eats the rest of the script.
          # No `set -e`: the server's .bash_logout fails without a terminal
          # and would turn every exit into 1.
          ssh $SERVER_USER@$SERVER_IP << EOF
            cd ~/docker/beerpong-api-go || exit 1

            gcloud auth activate-service-account --key-file=$FILE_PATH < /dev/null || exit 1
            gcloud auth configure-docker europe-west10-docker.pkg.dev --quiet < /dev/null || exit 1

            sed -i 's|^\(\s*image:\).*|\1 $DOCKER_IMAGE|' docker-compose.yml || exit 1
            sed -i '/^APNS_KEY/d' .env || exit 1
            printf 'APNS_KEY_ID=%s\nAPNS_KEY=%s\n' "$APNS_KEY_ID" "$APNS_KEY" >> .env || exit 1
            docker compose pull < /dev/null || exit 1
            docker compose up -d < /dev/null || exit 1

            for i in \$(seq 1 30); do
              if curl -sf https://beerpong.lb.staging.laurinnotemann.dev/healthcheck < /dev/null > /dev/null; then
                docker image prune -af < /dev/null > /dev/null
                exit 0
              fi
              sleep 2
            done
            docker compose logs --tail 50 < /dev/null
            exit 1
          EOF
