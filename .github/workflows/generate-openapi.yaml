name: Generate OpenApi

# please refer to OPENAPI_CODEGEN.md for details on this workflow

on:
  pull_request:
  workflow_dispatch:

jobs:
  generate-docs:
    permissions:
      contents: write
      pull-requests: write
    name: Generate Api docs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: user
          POSTGRES_DB: beerpong
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      # Early gate: only run if the most recent commit touched api/**
      - name: Check latest commit touches api/**
        id: latest_commit_api_check
        shell: bash
        run: |
          set -euo pipefail
          # Get the most recent commit that triggered this workflow
          LATEST_SHA="${{ github.sha }}"
          echo "Latest commit: $LATEST_SHA"
          CHANGED=$(git diff --name-only "${LATEST_SHA}^" "${LATEST_SHA}" -- 'api/**' || true)
          if [[ -z "${CHANGED}" ]]; then
            echo "No changes under api/** in the latest commit. Skipping workflow."
            exit 0
          else
            echo "Latest commit changed files under api/**:"
            echo "${CHANGED}"
          fi

      # Only check the most recent commit message for bot commit
      - name: Check most recent commit message
        id: check_authors
        shell: bash
        run: |
          set -euo pipefail
          LAST_MSG="$(git log -1 --format='%s')"
          echo "Most recent commit message: $LAST_MSG"
          if echo "$LAST_MSG" | grep -q "chore: update openapi types"; then
            echo "has_bot_author=true" >> $GITHUB_OUTPUT
            echo "Most recent commit is the bot update. Stopping the workflow."
            exit 0
          else
            echo "has_bot_author=false" >> $GITHUB_OUTPUT
            echo "Most recent commit is not the bot update. Continuing."
          fi

      # Restore state cache to remember last processed commit per branch.
      - name: Restore openapi state cache
        id: openapi_state_cache
        if: steps.check_authors.outputs.has_bot_author != 'true'
        uses: actions/cache@v4
        with:
          path: .ci/openapi-state
          key: openapi-state-${{ github.ref_name }}

      - name: Determine last processed commit
        id: last_sha
        if: steps.check_authors.outputs.has_bot_author != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/openapi-state
          STATE_FILE=".ci/openapi-state/last-sha"
          if [[ -f "$STATE_FILE" ]]; then
            LAST_SHA=$(cat "$STATE_FILE" || true)
          else
            LAST_SHA=""
          fi

          if [[ -z "${LAST_SHA}" ]]; then
            echo "No previous state found for this branch. First run will proceed."
            echo "first_run=true" >> $GITHUB_OUTPUT
          else
            echo "Found previous last SHA: $LAST_SHA"
            echo "first_run=false" >> $GITHUB_OUTPUT
            echo "last_sha=$LAST_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Detect api/** changes since last run
        id: detect_api_changes
        if: steps.check_authors.outputs.has_bot_author != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # If this is the first run on this branch, we always run.
          if [[ "${{ steps.last_sha.outputs.first_run }}" == "true" ]]; then
            echo "First run on this branch. Proceeding with generation."
            echo "api_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_SHA="${{ steps.last_sha.outputs.last_sha }}"
          echo "Diffing api/** between $LAST_SHA and HEAD"
          CHANGED="$(git diff --name-only "${LAST_SHA}"..HEAD -- 'api/**' || true)"

          if [[ -z "$CHANGED" ]]; then
            echo "api_changed=false" >> $GITHUB_OUTPUT
            echo "No changes under api/** since last run. Skipping."
            exit 0
          else
            echo "api_changed=true" >> $GITHUB_OUTPUT
            echo "Changed files since last run:"
            echo "$CHANGED"
          fi

      - name: Set up JDK 21 corretto
        if: steps.check_authors.outputs.has_bot_author != 'true' && steps.detect_api_changes.outputs.api_changed == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"
          cache: "maven"

      - name: Cache Maven packages
        if: steps.check_authors.outputs.has_bot_author != 'true' && steps.detect_api_changes.outputs.api_changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # spin up the backend including database, which is needed for the openapi generation
      - run: mvn verify
        if: steps.check_authors.outputs.has_bot_author != 'true' && steps.detect_api_changes.outputs.api_changed == 'true'
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: user
          POSTGRES_URL: jdbc:postgresql://localhost:5432/beerpong
          API_BASE_URL: http://localhost:8080/
          BACKEND_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
        working-directory: api

      # replace all occurrences of "*/*" with "application/json" in the openapi.json file
      - run: sed -i 's#"\*/\*"#"application/json"#g' ./mobile-app/api/generated/openapi.json
        if: steps.check_authors.outputs.has_bot_author != 'true' && steps.detect_api_changes.outputs.api_changed == 'true'

      - name: Cache npm packages
        if: steps.check_authors.outputs.has_bot_author != 'true' && steps.detect_api_changes.outputs.api_changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Use Node.js
        if: steps.check_authors.outputs.has_bot_author != 'true' && steps.detect_api_changes.outputs.api_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "mobile-app/package-lock.json"

      - run: npm ci && npm run gen-types && npm run format
        if: steps.check_authors.outputs.has_bot_author != 'true' && steps.detect_api_changes.outputs.api_changed == 'true'
        working-directory: mobile-app

      # Update last processed SHA and save cache (only if we ran)
      - name: Update last processed SHA
        if: steps.check_authors.outputs.has_bot_author != 'true' && steps.detect_api_changes.outputs.api_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/openapi-state
          git rev-parse HEAD > .ci/openapi-state/last-sha

      - name: Save openapi state cache
        if: steps.check_authors.outputs.has_bot_author != 'true' && steps.detect_api_changes.outputs.api_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci/openapi-state
          key: openapi-state-${{ github.ref_name }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        if: steps.check_authors.outputs.has_bot_author != 'true' && steps.detect_api_changes.outputs.api_changed == 'true'
        with:
          commit_message: "chore: update openapi types"
