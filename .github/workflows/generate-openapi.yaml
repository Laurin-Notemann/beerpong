name: Generate OpenApi

# please refer to OPENAPI_CODEGEN.md for details on this workflow

on:
  pull_request:
  workflow_dispatch:

jobs:
  generate-docs:
    permissions:
      contents: write
      pull-requests: write
    name: Generate Api docs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: user
          POSTGRES_DB: beerpong
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0  # full history so we can diff against older SHAs

      # Early gate: only run if the most recent commit touched api/**
      - name: Check latest commit touches api/**
        id: latest_commit_api_check
        shell: bash
        run: |
          set -euo pipefail
          LATEST_SHA="${{ github.sha }}"
          echo "Latest commit: $LATEST_SHA"
          # Ensure parent exists (merge commits have multiple parents; use first)
          PARENT_SHA="$(git rev-parse "${LATEST_SHA}^" 2>/dev/null || true)"
          if [[ -z "${PARENT_SHA}" ]]; then
            # If this is the first commit, just check the tree files
            CHANGED=$(git diff --name-only "${LATEST_SHA}" -- 'api/**' || true)
          else
            CHANGED=$(git diff --name-only "${LATEST_SHA}^" "${LATEST_SHA}" -- 'api/**' || true)
          fi
          if [[ -z "${CHANGED}" ]]; then
            echo "No changes under api/** in the latest commit. Skipping workflow."
            exit 0
          else
            echo "Latest commit changed files under api/**:"
            echo "${CHANGED}"
          fi

      # Only check the most recent commit message for bot commit
      - name: Check most recent commit message
        id: check_authors
        shell: bash
        run: |
          set -euo pipefail
          LAST_MSG="$(git log -1 --format='%s')"
          echo "Most recent commit message: $LAST_MSG"
          if echo "$LAST_MSG" | grep -q "chore: update openapi types"; then
            echo "has_bot_author=true" >> $GITHUB_OUTPUT
            echo "Most recent commit is the bot update. Stopping the workflow."
            exit 0
          else
            echo "has_bot_author=false" >> $GITHUB_OUTPUT
            echo "Most recent commit is not the bot update. Continuing."
          fi

      # Restore state cache to remember last processed commit per branch.
      - name: Restore openapi state cache
        id: openapi_state_cache
        if: steps.check_authors.outputs.has_bot_author != 'true'
        uses: actions/cache@v4
        with:
          path: .ci/openapi-state
          key: openapi-state-${{ github.ref_name }}

      - name: Determine last processed commit
        id: last_sha
        if: steps.check_authors.outputs.has_bot_author != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/openapi-state
          STATE_FILE=".ci/openapi-state/last-sha"
          LAST_SHA=""
          if [[ -f "$STATE_FILE" ]]; then
            LAST_SHA=$(cat "$STATE_FILE" || true)
          fi

          if [[ -z "${LAST_SHA}" ]]; then
            echo "No previous state found for this branch. First run will proceed."
            echo "first_run=true" >> $GITHUB_OUTPUT
          else
            echo "Found previous last SHA (from cache): $LAST_SHA"
            echo "first_run=false" >> $GITHUB_OUTPUT
            echo "last_sha=$LAST_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Detect api/** changes since last run
        id: detect_api_changes
        if: steps.check_authors.outputs.has_bot_author != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # First run on this branch: always run
          if [[ "${{ steps.last_sha.outputs.first_run }}" == "true" ]]; then
            echo "First run on this branch. Proceeding with generation."
            echo "api_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CACHED_LAST_SHA="${{ steps.last_sha.outputs.last_sha }}"

          # Make sure the cached SHA exists in history; if not, pick a safe fallback.
          if ! git cat-file -e "${CACHED_LAST_SHA}^{commit}" 2>/dev/null; then
            echo "Cached last SHA ${CACHED_LAST_SHA} is not reachable; falling back."
            # Try merge-base with the remote branch head
            # Determine the remote tracking ref (pull_request -> use refs/pull/.../merge base via base_ref)
            BRANCH_NAME="${{ github.ref_name }}"
            # Fetch the remote branch if base_ref is available (PR context)
            if [[ -n "${{ github.base_ref }}" ]]; then
              git fetch origin "${{ github.base_ref }}" --depth=200 || true
              FALLBACK_BASE="$(git merge-base HEAD "origin/${{ github.base_ref }}")" || true
            else
              # Not a PR: ensure we have recent history
              git fetch origin "${BRANCH_NAME}:${BRANCH_NAME}" --depth=200 || true
              FALLBACK_BASE="$(git merge-base HEAD "${BRANCH_NAME}")" || true
            fi

            if [[ -n "${FALLBACK_BASE}" ]]; then
              BASE_SHA="${FALLBACK_BASE}"
              echo "Using merge-base fallback: ${BASE_SHA}"
            else
              # Final fallback: root commit
              BASE_SHA="$(git rev-list --max-parents=0 HEAD | tail -n1)"
              echo "Using root commit fallback: ${BASE_SHA}"
            fi
          else
            BASE_SHA="${CACHED_LAST_SHA}"
          fi

          echo "Diffing api/** between $BASE_SHA and HEAD"
          CHANGED="$(git diff --name-only "${BASE_SHA}"..HEAD -- 'api/**' || true)"

          if [[ -z "$CHANGED" ]]; then
            echo "api_changed=false" >> $GITHUB_OUTPUT
            echo "No changes under api/** since last processed base. Skipping."
            exit 0
          else
            echo "api_changed=true" >> $GITHUB_OUTPUT
            echo "Changed files since last processed base:"
            echo "$CHANGED"
          fi

      - name: Set up JDK 21 corretto
        if: steps.check_authors.outputs.has_bot_author != 'true' && steps.detect_api_changes.outputs.api_changed == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"
          cache: "maven"

      - name: Cache Maven packages
        if: steps.check_authors.outputs.has_bot_author != 'true' && steps.detect_api_changes.outputs.api_changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build backend and generate OpenAPI
        if: steps.check_authors.outputs.has_bot_author != 'true' && steps.detect_api_changes.outputs.api_changed == 'true'
        run: mvn verify
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: user
          POSTGRES_URL: jdbc:postgresql://localhost:5432/beerpong
          API_BASE_URL: http://localhost:8080/
          BACKEND_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
        working-directory: api

      - name: Fix content-type in generated OpenAPI
        if: steps.check_authors.outputs.has_bot_author != 'true' && steps.detect_api_changes.outputs.api_changed == 'true'
        run: sed -i 's#"\*/\*"#"application/json"#g' ./mobile-app/api/generated/openapi.json

      - name: Cache npm packages
        if: steps.check_authors.outputs.has_bot_author != 'true' && steps.detect_api_changes.outputs.api_changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Use Node.js
        if: steps.check_authors.outputs.has_bot_author != 'true' && steps.detect_api_changes.outputs.api_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "mobile-app/package-lock.json"

      - name: Generate client types
        if: steps.check_authors.outputs.has_bot_author != 'true' && steps.detect_api_changes.outputs.api_changed == 'true'
        working-directory: mobile-app
        run: |
          npm ci
          npm run gen-types
          npm run format

      - name: Update last processed SHA
        if: steps.check_authors.outputs.has_bot_author != 'true' && steps.detect_api_changes.outputs.api_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/openapi-state
          git rev-parse HEAD > .ci/openapi-state/last-sha

      - name: Save openapi state cache
        if: steps.check_authors.outputs.has_bot_author != 'true' && steps.detect_api_changes.outputs.api_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci/openapi-state
          key: openapi-state-${{ github.ref_name }}

      - name: Commit generated types
        if: steps.check_authors.outputs.has_bot_author != 'true' && steps.detect_api_changes.outputs.api_changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update openapi types"
