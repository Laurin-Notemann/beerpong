name: Api Go CI

# Vets and builds the Go API. The staging deploy runs this next to the image build
# and deploys only if both pass. The unit tests and the contract suite (api-tests/)
# don't run in CI; run them locally.

on:
  push:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-go-ci.yml"
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: Go vet and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Vet and build
        working-directory: apps/api
        run: go vet ./... && go build ./...
