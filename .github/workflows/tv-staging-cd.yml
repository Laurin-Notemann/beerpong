name: TV Staging Deploy

# Tests, builds and deploys the TV app (tv/) to the staging server, where it runs in
# ~/docker/versus-tv as the compose service `tv` (see tv/README.md for the one-time setup).

on:
  push:
    branches:
      - "staging"
    paths:
      - "tv/**"
      - "mobile-app/lib/**"
      - "mobile-app/api/utils/**"
      - "mobile-app/components/CupGrid/**"
      - "mobile-app/utils/**"
      - "mobile-app/openapi/**"
      - ".github/workflows/tv-staging-cd.yml"
      - ".github/workflows/tv-ci.yml"
  workflow_dispatch:

concurrency:
  group: tv-staging-deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tv-ci.yml

  build:
    needs: test
    permissions:
      id-token: write
      contents: read
    name: Build and push the staging image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: true
          token_format: access_token
          workload_identity_provider: 'projects/5685154754/locations/global/workloadIdentityPools/cd-beerpong/providers/github-actions'
          service_account: 'cd-beerpong@beer-pong-441815.iam.gserviceaccount.com'
      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: europe-west10-docker.pkg.dev/beer-pong-441815/api-beerpong
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: tv/Dockerfile
          platforms: linux/amd64
          tags: europe-west10-docker.pkg.dev/beer-pong-441815/api-beerpong/tv-staging:${{ github.sha }}

  deploy:
    needs: build
    name: Deploy on the staging server
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_SECRET }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy and wait until it answers
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          FILE_PATH: ${{ secrets.PATH_TO_SERVICE_ACC_JSON }}
          DOCKER_IMAGE: europe-west10-docker.pkg.dev/beer-pong-441815/api-beerpong/tv-staging:${{ github.sha }}
        run: |
          # Same shape as the API deploy (api-staging-cd.yml): stdin is the script, no `set -e`.
          ssh $SERVER_USER@$SERVER_IP << EOF
            cd ~/docker/versus-tv || exit 1

            gcloud auth activate-service-account --key-file=$FILE_PATH < /dev/null || exit 1
            gcloud auth configure-docker europe-west10-docker.pkg.dev --quiet < /dev/null || exit 1

            sed -i 's|^\(\s*image:\).*|\1 $DOCKER_IMAGE|' docker-compose.yml || exit 1
            docker compose pull < /dev/null || exit 1
            docker compose up -d < /dev/null || exit 1

            for i in \$(seq 1 30); do
              if docker compose exec -T tv wget -qO /dev/null http://127.0.0.1:3000/ < /dev/null; then
                exit 0
              fi
              sleep 2
            done
            docker compose logs --tail 50 < /dev/null
            exit 1
          EOF
