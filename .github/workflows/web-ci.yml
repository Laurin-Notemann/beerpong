name: Web CI

# The staging deploy vets the web app next to its image build and deploys only if both pass.
# Branch checks (including the shared mobile code) run once in js-ci.yml.

on:
  workflow_call:
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/web

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run typecheck
      - run: pnpm run build
